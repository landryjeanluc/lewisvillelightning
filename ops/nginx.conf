# Reference server block for the internal listener behind the TLS proxy.
# Do not expose port 8111 or the loopback API directly to the Internet.
server {
    listen 8111;
    server_name lvlnb.ca;
    root /srv/lvlnb;
    index index.html;
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 13m;
    client_body_timeout 15s;

    # Inherited by all locations: sensitive HTML, calendars and photos must not
    # survive logout in the HTTP cache. Public assets can also be served no-store
    # safely; their small performance cost is preferable to a broad exception.
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # frame-src names YouTube because /watch plays the team's stream inside an
    # iframe. script-src stays 'self': the broadcast overlay is our own DOM drawn
    # over that frame, and no YouTube JavaScript runs on our pages, so embedding
    # a stream does not widen what can execute here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    auth_request /_auth;
    location = /_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:8112/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location @login { return 302 /login; }
    location = /login { auth_request off; try_files /login/index.html =404; }
    location = /forgot { auth_request off; try_files /forgot/index.html =404; }
    location = /reset {
        auth_request off;
        access_log off; # Reset tokens appear in query strings. Never log them.
        try_files /reset/index.html =404;
    }
    location = /reset/ { auth_request off; access_log off; return 302 /reset; }
    # The application authenticates every API route by default and returns JSON
    # 401/403 responses. Do not turn API failures into HTML login redirects.
    location ^~ /api/ {
        auth_request off;
        proxy_pass http://127.0.0.1:8112/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
    # Public assets must contain no roster, schedule, photos or inline secrets.
    location ^~ /_astro/ { auth_request off; try_files $uri =404; }
    location ^~ /fonts/ { auth_request off; try_files $uri =404; }
    location ^~ /brand/ { auth_request off; try_files $uri =404; }
    location ^~ /icons/ { auth_request off; try_files $uri =404; }
    location = /favicon.ico { auth_request off; }
    location = /favicon.svg { auth_request off; }
    location = /manifest.webmanifest { auth_request off; }
    location = /sw.js { auth_request off; }
    location ^~ /uploads/ {
        error_page 401 = @login;
        alias /srv/lvlnb-uploads/;
    }
    location / {
        error_page 401 = @login;
        try_files $uri $uri/ =404;
    }
}

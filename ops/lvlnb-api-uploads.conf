# Install as /etc/systemd/system/lvlnb-api.service.d/uploads.conf.
# Keep ProtectSystem=strict; grant writes only to the API's upload directory.
# The directory must be owned by lvlnb and readable by nginx (mode 0755).
# When incorporating this in the NixOS service, add the same directory to
# serviceConfig.ReadWritePaths and provision its ownership with tmpfiles.
[Service]
ReadWritePaths=/srv/lvlnb-uploads
